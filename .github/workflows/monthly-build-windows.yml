name: Monthly Build – Windows

on:
  schedule:
    # Run on the 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      build_status: ${{ steps.set_status.outputs.status }}
      test_status: ${{ steps.set_test_status.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-python
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-flex
            mingw-w64-x86_64-bison

      - name: Generate configure script
        shell: msys2 {0}
        run: ./autogen.sh

      - name: Configure
        shell: msys2 {0}
        # On Windows: Wine compatibility layer is NOT needed (Wine runs Windows apps on Unix;
        # building natively on Windows makes it redundant). Darling (macOS layer) and
        # ipasim (iOS layer) are also not applicable on Windows.
        run: |
          ./configure \
            --disable-wine \
            --disable-darling \
            --disable-ipasim

      - name: Build
        id: build_step
        shell: msys2 {0}
        run: |
          make -j$(nproc) 2>&1 | tee /tmp/build-windows.log
          exit ${PIPESTATUS[0]}

      - name: Set build status
        id: set_status
        if: always()
        shell: msys2 {0}
        run: |
          if [ "${{ steps.build_step.outcome }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        id: test_step
        shell: msys2 {0}
        continue-on-error: true
        run: |
          make -j$(nproc) check 2>&1 | tee /tmp/test-windows.log
          exit ${PIPESTATUS[0]}

      - name: Set test status
        id: set_test_status
        if: always()
        shell: msys2 {0}
        run: |
          if [ "${{ steps.test_step.outcome }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs-${{ github.run_id }}
          path: |
            C:/msys64/tmp/build-windows.log
            C:/msys64/tmp/test-windows.log
          if-no-files-found: ignore

  report-errors:
    runs-on: ubuntu-latest
    needs: build
    if: always() && (needs.build.outputs.build_status == 'failure' || needs.build.outputs.test_status == 'failure')

    steps:
      - uses: actions/checkout@v4

      - name: Download logs
        uses: actions/download-artifact@v4
        with:
          name: windows-build-logs-${{ github.run_id }}
          path: /tmp/logs/

      - name: Create error report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_STATUS="${{ needs.build.outputs.build_status }}"
          TEST_STATUS="${{ needs.build.outputs.test_status }}"

          TITLE="🔴 Monthly Windows Build Failed – $(date +'%B %Y')"

          BODY="## Monthly Windows Build Report

          **Date:** $(date -u +'%Y-%m-%d %H:%M UTC')
          **Build Status:** ${BUILD_STATUS}
          **Test Status:** ${TEST_STATUS}
          **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Build Log Excerpt

          \`\`\`
          $(tail -100 /tmp/logs/build-windows.log 2>/dev/null || echo 'No build log available')
          \`\`\`

          ### Test Log Excerpt

          \`\`\`
          $(grep -E '^(FAIL|ERROR|make.*Error|Test failed)' /tmp/logs/test-windows.log 2>/dev/null | head -50 || echo 'No test errors found')
          \`\`\`

          ### Platform Notes

          - Wine layer is **disabled** on Windows (Wine is designed to run Windows apps on Unix; not applicable natively).
          - Darling (macOS layer) is **disabled** on Windows.
          - ipasim (iOS layer) is **disabled** on Windows.

          ### Next Steps

          1. Review the full workflow logs linked above.
          2. Check for Windows-specific compilation errors.
          3. Ensure MSYS2 and MinGW toolchain versions are up to date.

          *This issue was automatically created by the monthly Windows build workflow.*"

          gh issue create \
            --title "${TITLE}" \
            --body "${BODY}" \
            --label "build-failure,automated" || echo "Failed to create issue (labels may not exist)"
