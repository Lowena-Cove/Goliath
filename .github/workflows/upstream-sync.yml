name: Sync Upstream Dependencies

# Agentic workflow definition: upstream-sync.md (same directory)
# Install gh-aw locally:  gh extension install github/gh-aw
# Docs: https://github.github.com/gh-aw/setup/quick-start/

on:
  schedule:
    # Run monthly on the 1st at 01:00 UTC
    - cron: '0 1 1 * *'
  push:
    branches: [ "dev" ]
    paths:
      - '.github/workflows/upstream-sync.yml'
      - '.github/workflows/upstream-sync.md'
  pull_request:
    branches: [ "dev" ]
    paths:
      - '.github/workflows/upstream-sync.yml'
      - '.github/workflows/upstream-sync.md'
  workflow_dispatch:
    inputs:
      project:
        description: 'Specific project to sync (all, wine, darling, atl, wsl, libretro, ipasim)'
        required: false
        default: 'all'

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wine
            repo: wine/wine
            path: upstream/wine
            branch: master
            is_gitlab: true
            gitlab_host: gitlab.winehq.org
          - name: darling
            repo: darlinghq/darling
            path: upstream/darlin-upstream
            branch: master
          - name: atl
            repo: android_translation_layer/android_translation_layer
            path: upstream/atl-upstream
            branch: main
            is_gitlab: true
            gitlab_host: gitlab.com
          - name: wsl
            repo: microsoft/WSL
            path: upstream/wsl-upstream
            branch: master
          - name: libretro
            repo: libretro/libretro-common
            path: upstream/libretro-upstream
            branch: master
          - name: ipasim
            repo: ipasimulator/ipasim
            path: libs/ipasim
            branch: master

    steps:
      - name: Checkout Goliath
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "Goliath Upstream Sync Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if project should be synced
        id: should_sync
        run: |
          INPUT="${{ github.event.inputs.project }}"
          if [ -z "${INPUT}" ] || [ "${INPUT}" = "all" ] || [ "${INPUT}" = "${{ matrix.name }}" ]; then
            echo "sync=true" >> $GITHUB_OUTPUT
          else
            echo "sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone upstream repository (GitHub)
        if: steps.should_sync.outputs.sync == 'true' && !matrix.is_gitlab
        run: |
          mkdir -p /tmp/upstream
          for i in 1 2 3; do
            git clone --depth 50 https://github.com/${{ matrix.repo }}.git /tmp/upstream/${{ matrix.name }} && break
            echo "Clone attempt $i failed – retrying in 15s..."
            rm -rf /tmp/upstream/${{ matrix.name }}
            sleep 15
          done

      - name: Clone upstream repository (GitLab – winehq.org)
        if: steps.should_sync.outputs.sync == 'true' && matrix.is_gitlab && matrix.gitlab_host == 'gitlab.winehq.org'
        run: |
          mkdir -p /tmp/upstream
          for i in 1 2 3; do
            git clone --depth 50 https://gitlab.winehq.org/${{ matrix.repo }}.git /tmp/upstream/${{ matrix.name }} && break
            echo "Clone attempt $i failed – retrying in 15s..."
            rm -rf /tmp/upstream/${{ matrix.name }}
            sleep 15
          done

      - name: Clone upstream repository (GitLab – gitlab.com)
        if: steps.should_sync.outputs.sync == 'true' && matrix.is_gitlab && matrix.gitlab_host == 'gitlab.com'
        run: |
          mkdir -p /tmp/upstream
          for i in 1 2 3; do
            git clone --depth 50 https://gitlab.com/${{ matrix.repo }}.git /tmp/upstream/${{ matrix.name }} && break
            echo "Clone attempt $i failed – retrying in 15s..."
            rm -rf /tmp/upstream/${{ matrix.name }}
            sleep 15
          done

      - name: Get latest upstream commit
        if: steps.should_sync.outputs.sync == 'true'
        id: upstream_commit
        run: |
          cd /tmp/upstream/${{ matrix.name }}
          COMMIT=$(git rev-parse HEAD)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "short_commit=${SHORT_COMMIT}" >> $GITHUB_OUTPUT
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "Upstream commit: ${COMMIT}"

      - name: Check current integration version
        if: steps.should_sync.outputs.sync == 'true'
        id: current_version
        run: |
          if [ -f "${{ matrix.path }}/.upstream_version" ]; then
            CURRENT=$(head -1 "${{ matrix.path }}/.upstream_version" | tr -d '\r')
            echo "version=${CURRENT}" >> $GITHUB_OUTPUT
            echo "Current version: ${CURRENT}"
          else
            echo "version=none" >> $GITHUB_OUTPUT
            echo "No version file found"
          fi

      - name: Compare versions
        if: steps.should_sync.outputs.sync == 'true'
        id: compare
        run: |
          if [ "${{ steps.current_version.outputs.version }}" = "${{ steps.upstream_commit.outputs.commit }}" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "No update needed – already at latest version"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update available!"
          fi

      - name: Create update branch
        if: steps.should_sync.outputs.sync == 'true' && steps.compare.outputs.needs_update == 'true'
        run: |
          BRANCH_NAME="upstream-sync/${{ matrix.name }}-${{ steps.upstream_commit.outputs.short_commit }}"
          git checkout -b "${BRANCH_NAME}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Sync changes from upstream
        if: steps.should_sync.outputs.sync == 'true' && steps.compare.outputs.needs_update == 'true'
        run: |
          if [ ! -f "${{ matrix.path }}/.integration_map" ]; then
            echo "# Integration mapping for ${{ matrix.name }}" > "${{ matrix.path }}/.integration_map"
            echo "# Format: upstream_path:goliath_path:action" >> "${{ matrix.path }}/.integration_map"
          fi

          cd /tmp/upstream/${{ matrix.name }}

          if [ "${{ steps.current_version.outputs.version }}" != "none" ]; then
            echo "Files changed since last sync:" > /tmp/changes_${{ matrix.name }}.txt
            git diff --name-status ${{ steps.current_version.outputs.version }}..HEAD \
              >> /tmp/changes_${{ matrix.name }}.txt 2>/dev/null \
              || echo "Could not get diff (shallow clone may not have the old commit)" \
              >> /tmp/changes_${{ matrix.name }}.txt
          else
            echo "Initial sync – all files are new" > /tmp/changes_${{ matrix.name }}.txt
          fi

          cat /tmp/changes_${{ matrix.name }}.txt

      - name: Update version tracking file
        if: steps.should_sync.outputs.sync == 'true' && steps.compare.outputs.needs_update == 'true'
        run: |
          # Some upstream paths may be orphaned submodule entries (mode 160000 in
          # the index, but no .gitmodules URL). Regular files can't be git-added
          # over a submodule entry, so remove the stale entry first.
          if git ls-files --stage "${{ matrix.path }}" | grep -q '^160000 '; then
            git rm --cached "${{ matrix.path }}" || true
          fi

          mkdir -p "${{ matrix.path }}"
          echo "${{ steps.upstream_commit.outputs.commit }}" > "${{ matrix.path }}/.upstream_version"
          echo "${{ matrix.repo }}" > "${{ matrix.path }}/.upstream_repo"
          date -u +"%Y-%m-%d %H:%M:%S UTC" > "${{ matrix.path }}/.last_sync"

          GITLAB_URL=""
          if [ "${{ matrix.is_gitlab }}" = "true" ] && [ "${{ matrix.gitlab_host }}" = "gitlab.winehq.org" ]; then
            GITLAB_URL="https://gitlab.winehq.org/${{ matrix.repo }}"
          elif [ "${{ matrix.is_gitlab }}" = "true" ]; then
            GITLAB_URL="https://gitlab.com/${{ matrix.repo }}"
          fi
          REPO_URL="${GITLAB_URL:-https://github.com/${{ matrix.repo }}}"

          cat > "${{ matrix.path }}/UPSTREAM_SYNC.md" << SYNC_EOF
          # Upstream Sync Information for ${{ matrix.name }}
          
          **Last Synced:** $(cat "${{ matrix.path }}/.last_sync" 2>/dev/null || echo unknown)
          **Upstream Repository:** ${REPO_URL}
          **Upstream Commit:** ${{ steps.upstream_commit.outputs.commit }}
          **Upstream Commit Message:** ${{ steps.upstream_commit.outputs.commit_msg }}
          
          ## Recent Changes
          
          See the changes report below for details on what was updated from upstream.
          
          ## Integration Notes
          
          This integration is automatically tracked and updated monthly from the upstream repository.
          Manual modifications should be documented in \`.integration_map\` to avoid conflicts.
          
          ## Platform Exclusions
          
          | Layer    | Linux | Windows | macOS |
          |----------|-------|---------|-------|
          | Wine     | ✅    | ❌      | ✅    |
          | Darling  | ❌    | ❌      | ✅    |
          | WSL      | ✅    | ❌      | ❌    |
          | Libretro | ✅    | ✅      | ✅    |
          | ipasim   | ❌    | ❌      | ✅    |
          | ATL      | ✅    | ❌      | ❌    |
          
          SYNC_EOF

          if [ -f /tmp/changes_${{ matrix.name }}.txt ]; then
            cat >> "${{ matrix.path }}/UPSTREAM_SYNC.md" << CHANGES_EOF
          
          ## Changes in This Sync
          
          $(cat /tmp/changes_${{ matrix.name }}.txt)
          
          CHANGES_EOF
          fi

      - name: Commit changes
        id: commit_step
        if: steps.should_sync.outputs.sync == 'true' && steps.compare.outputs.needs_update == 'true'
        run: |
          git add "${{ matrix.path }}"
          if git diff --staged --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "Nothing changed after staging – skipping commit"
          else
            COMMIT_MSG="sync: Update ${{ matrix.name }} to upstream ${{ steps.upstream_commit.outputs.short_commit }}
          
          Upstream: ${{ matrix.repo }}
          Commit: ${{ steps.upstream_commit.outputs.commit }}
          Message: ${{ steps.upstream_commit.outputs.commit_msg }}
          
          Automated monthly sync from the upstream repository.
          See ${{ matrix.path }}/UPSTREAM_SYNC.md for details."
            git commit -m "${COMMIT_MSG}"
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes and create PR
        if: steps.should_sync.outputs.sync == 'true' && steps.compare.outputs.needs_update == 'true' && steps.commit_step.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Force-push to handle branches that already exist from a previous run
          # (non-fast-forward rejection). The branch is ephemeral — only used to
          # back the sync PR — so force-pushing is safe.
          git push --force origin "${BRANCH_NAME}"

          GITLAB_URL=""
          if [ "${{ matrix.is_gitlab }}" = "true" ] && [ "${{ matrix.gitlab_host }}" = "gitlab.winehq.org" ]; then
            GITLAB_URL="https://gitlab.winehq.org/${{ matrix.repo }}"
          elif [ "${{ matrix.is_gitlab }}" = "true" ]; then
            GITLAB_URL="https://gitlab.com/${{ matrix.repo }}"
          fi
          REPO_URL="${GITLAB_URL:-https://github.com/${{ matrix.repo }}}"

          cat > /tmp/pr_body_${{ matrix.name }}.md << PR_BODY_EOF
          ## Upstream Sync: ${{ matrix.name }}
          
          This PR automatically syncs changes from the upstream repository.
          
          **Upstream Repository:** ${REPO_URL}
          **Upstream Commit:** ${{ steps.upstream_commit.outputs.commit }}
          **Commit Message:** ${{ steps.upstream_commit.outputs.commit_msg }}
          
          ### Changes Summary
          
          See \`${{ matrix.path }}/UPSTREAM_SYNC.md\` for detailed change information.
          
          ### Integration Status
          
          - [x] Version tracking updated
          - [x] Sync metadata generated
          - [ ] Build verification needed
          - [ ] Integration testing needed
          
          ### Platform Exclusion Matrix
          
          | Layer    | Linux | Windows | macOS |
          |----------|-------|---------|-------|
          | Wine     | ✅    | ❌      | ✅    |
          | Darling  | ❌    | ❌      | ✅    |
          | WSL      | ✅    | ❌      | ❌    |
          | Libretro | ✅    | ✅      | ✅    |
          | ipasim   | ❌    | ❌      | ✅    |
          | ATL      | ✅    | ❌      | ❌    |
          
          ### Review Checklist
          
          - [ ] Verify no breaking changes in API
          - [ ] Check for new dependencies
          - [ ] Ensure integration still works
          - [ ] Update documentation if needed
          - [ ] Run full test suite
          
          ---
          
          *Automated PR created by the monthly Upstream Sync workflow.*
          *Issues with this PR? Check the workflow logs or \`.integration_map\` file.*
          PR_BODY_EOF

          gh pr create \
            --title "🔄 Sync ${{ matrix.name }} from upstream (${{ steps.upstream_commit.outputs.short_commit }})" \
            --body-file "/tmp/pr_body_${{ matrix.name }}.md" \
            --label "upstream-sync" \
            --label "automated" \
            --base dev || echo "PR might already exist or could not be created"

      - name: Summary
        if: steps.should_sync.outputs.sync == 'true'
        run: |
          if [ "${{ steps.compare.outputs.needs_update }}" = "true" ]; then
            echo "✅ Update created for ${{ matrix.name }}"
            echo "📦 New version: ${{ steps.upstream_commit.outputs.short_commit }}"
          else
            echo "✓ ${{ matrix.name }} is already up to date"
          fi

  create-integration-docs:
    runs-on: ubuntu-latest
    needs: check-updates
    # Only push docs on schedule/dispatch/push – PRs use a detached merge commit
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create/Update integration documentation
        run: |
          mkdir -p documentation/upstream-sync

          cat > documentation/upstream-sync/README.md << README_EOF
          # Upstream Synchronization
          
          This directory contains documentation for how Goliath tracks and integrates
          updates from upstream projects.
          
          ## Tracked Projects
          
          Goliath integrates code from the following upstream projects:
          
          1. Wine (Windows app compatibility - primary foundation)
             - Repository: https://gitlab.winehq.org/wine/wine
             - Integration path: upstream/wine/
             - Auto-sync: Monthly
          
          2. Darling (macOS/Darwin compatibility)
             - Repository: https://github.com/darlinghq/darling
             - Integration path: upstream/darlin-upstream/
             - Auto-sync: Monthly
          
          3. ATL (Android Translation Layer)
             - Repository: https://gitlab.com/android_translation_layer/android_translation_layer
             - Integration path: upstream/atl-upstream/
             - Auto-sync: Monthly
          
          4. WSL (Windows Subsystem for Linux concepts)
             - Repository: https://github.com/microsoft/WSL
             - Integration path: upstream/wsl-upstream/
             - Auto-sync: Monthly
          
          5. Libretro (Console emulation common library)
             - Repository: https://github.com/libretro/libretro-common
             - Integration path: upstream/libretro-upstream/
             - Auto-sync: Monthly
          
          6. ipasim (iOS simulation)
             - Repository: https://github.com/ipasimulator/ipasim
             - Integration path: libs/ipasim/
             - Auto-sync: Monthly
          
          ## Platform Exclusion Matrix
          
          | Layer    | Linux | Windows | macOS | Notes |
          |----------|:-----:|:-------:|:-----:|-------|
          | Wine     | ✅    | ❌      | ✅    | Wine runs Windows apps on Unix; redundant on Windows itself |
          | Darling  | ❌    | ❌      | ✅    | macOS/Darwin compatibility layer |
          | WSL      | ✅    | ❌      | ❌    | Linux-specific WSL concepts |
          | Libretro | ✅    | ✅      | ✅    | Cross-platform; always included |
          | ipasim   | ❌    | ❌      | ✅    | iOS simulation (requires macOS/Darwin) |
          | ATL      | ✅    | ❌      | ❌    | Android Translation Layer for Linux |
          
          ## How It Works
          
          The upstream-sync.yml workflow automatically:
          
          1. Checks each upstream repository monthly
          2. Compares the latest upstream commit with our integrated version
          3. Creates a PR when updates are available
          4. Tracks version information in .upstream_version files
          5. Documents changes in UPSTREAM_SYNC.md files
          
          ## Manual Sync
          
          Run: gh workflow run upstream-sync.yml -f project=wine
          Run: gh workflow run upstream-sync.yml -f project=all
          
          ## Version Tracking
          
          Each library directory contains:
          
          - .upstream_version - The current upstream commit hash
          - .upstream_repo - The upstream repository path
          - .last_sync - Timestamp of last successful sync
          - UPSTREAM_SYNC.md - Human-readable sync report
          README_EOF

          echo "Integration documentation updated"

      - name: Commit documentation
        run: |
          git config user.name "Goliath Upstream Sync Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add documentation/upstream-sync/
          git diff --staged --quiet || git commit -m "docs: Update upstream sync documentation"
          git push || echo "No changes to push"
